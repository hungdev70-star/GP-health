name: Flutter checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  android-preview:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - name: Set up compatible Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate Android platform project
        run: flutter create --platforms=android --org com.gphealth --project-name gp_health .
      - name: Configure Android speech permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('<manifest ', '<manifest ', 1)
          marker = '<application'
          nl = chr(10)
          permissions = '    <uses-permission android:name="android.permission.RECORD_AUDIO" />' + nl + '    <uses-permission android:name="android.permission.INTERNET" />' + nl
          if 'android.permission.RECORD_AUDIO' not in s:
              s = s.replace(marker, permissions + marker, 1)
          if '<queries>' not in s:
              queries = nl.join(['    <queries>', '        <intent>', '            <action android:name="android.speech.RecognitionService" />', '        </intent>', '    </queries>']) + nl
              s = s.replace(marker, queries + marker, 1)
          p.write_text(s)
          PY
      - name: Configure Android SDK for voice plugins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
          s = s.replace('ndkVersion = flutter.ndkVersion', 'ndkVersion = "27.0.12077973"')
          s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
          p.write_text(s)
          PY
      - name: Upgrade Kotlin Gradle plugin for speech dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/settings.gradle.kts')
          s = p.read_text()
          pattern = r"(id\\(\\"org\\.jetbrains\\.kotlin\\.android\\"\\)\\s+version\\s+)\\"[^\\"]+\\""
          s, count = re.subn(pattern, r'\\g<1>"2.2.20"', s, count=1)
          if count == 0:
              raise SystemExit('Kotlin Gradle plugin declaration was not found')
          p.write_text(s)
          print(s)
          PY
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload Android preview
        uses: actions/upload-artifact@v4
        with:
          name: gp-health-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
